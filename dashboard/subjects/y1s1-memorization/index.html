3eاحترام أعضاء هيئة التدريس والإداريين والزملاء.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eتجنب الغيبة والنميمة والجدال بغير علم.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eلا يتم فتح الددرس صوتيا أو مرئيا للطالب إلا بعد الانتهاء من الدرس السابق والإجابة على الأسئلة إذا وجدت وذلك لضمان جدية الطالب.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eيمنع حال الاختبار الرجوع إلى المحاضرات أو أي مصدر خارجي، التزاما بالأمانة وتجنبا للغش.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eيتم تفاعل الطلاب مع المعلمين والإدارة والإشراف والزملاء من خلال مجموعات تفاعلية عبر تليجرام مجموعة للرجال ومجموعة للنساء كل على حدة.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eيعد المعهد بعض اللقاءات المباشرة مع المعلمين ويعلن عنها مسبقا.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eيعد المعهد بعض اللقاءات العلمية والوعظية الإثرائية المفيدة، خارج المقررات الدراسية ولا ترتبط بالاختبارات.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eفي حال وجود شكوى من أي مشكلة يتم التواصل مع الإدارة مباشرة.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003eالقبول والتسجيل\u003c/h2\u003e\u003cp\u003eيُشترط للقبول في المعهد استكمال نموذج التسجيل وتقديم المستندات المطلوبة، ويحق للإدارة قبول أو رفض أي طلب وفق المعايير المعتمدة.\u003c/p\u003e\u003ch2\u003eالاختبارات والتقييم\u003c/h2\u003e\u003cp\u003eيُقيَّم الطالب من خلال الاختبارات الفصلية والنهائية، واجتياز اختبارات الدروس، والالتزام بالواجبات والأنشطة التعليمية.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eنظام التقييم  -   النسبة\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eالاختبارات التحريرية:    70%\u003c/p\u003e\u003cp\u003eالحضور والمشاركة والواجبات:    30% في المستوى التمهيدي والتأصيلي، أما في مستوى التخصص فتكون 15 %\u003c/p\u003e\u003cp\u003eالبحوث والتطبيقات العلمية 15% (خاص بمستوى التخصص)\u003c/p\u003e\u003cp\u003eالمجموع 100%\u003c/p\u003e\u003ch2\u003eالانضباط والجزاءات\u003c/h2\u003e\u003cp\u003eفي حال مخالفة اللائحة، يحق للإدارة توجيه إنذار أو إيقاف مؤقت أو فصل نهائي بحسب جسامة المخالفة.\u003c/p\u003e\u003ch2\u003eأحكام ختامية\u003c/h2\u003e\u003cp\u003eتحتفظ إدارة المعهد بحق تعديل هذه اللائحة عند الحاجة، ويُبلَّغ الطلاب بأي تحديث عبر القنوات الرسمية للمعهد.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"2:[\"$\",\"html\",null,{\"lang\":\"ar\",\"dir\":\"rtl\",\"className\":\"cairo_883b24e3-module__pW5XIG__variable h-full scroll-smooth\",\"style\":{\"--brand-primary\":\"#08254b\",\"--brand-primary-dark\":\"#061b36\",\"--brand-primary-light\":\"#344c6b\",\"--brand-gold\":\"#d4ba84\",\"--brand-gold-light\":\"#ddc99f\",\"--background\":\"#eef1f5\",\"--foreground\":\"#071f40\",\"--brand-surface\":\"#ffffff\",\"--brand-border\":\"#dce1e7\",\"--color-brand\":\"#08254b\",\"--color-brand-dark\":\"#061b36\",\"--color-brand-light\":\"#344c6b\",\"--color-gold\":\"#d4ba84\",\"--color-gold-light\":\"#ddc99f\",\"--color-background\":\"#eef1f5\",\"--color-foreground\":\"#071f40\",\"--color-border\":\"#dce1e7\",\"--shadow-card\":\"0 4px 24px -4px #08254b14\",\"--shadow-card-hover\":\"0 12px 40px -8px #08254b26\"},\"suppressHydrationWarning\":true,\"children\":[[\"$\",\"head\",null,{\"children\":[[\"$\",\"style\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\":root{--brand-primary:#08254b;--brand-primary-dark:#061b36;--brand-primary-light:#344c6b;--brand-gold:#d4ba84;--brand-gold-light:#ddc99f;--background:#eef1f5;--foreground:#071f40;--brand-surface:#ffffff;--brand-border:#dce1e7;--color-brand:#08254b;--color-brand-dark:#061b36;--color-brand-light:#344c6b;--color-gold:#d4ba84;--color-gold-light:#ddc99f;--color-background:#eef1f5;--color-foreground:#071f40;--color-border:#dce1e7;--shadow-card:0 4px 24px -4px #08254b14;--shadow-card-hover:0 12px 40px -8px #08254b26}\"}}],[\"$\",\"$L11\",null,{\"src\":\"/config.js\",\"strategy\":\"beforeInteractive\"}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"EducationalOrganization\\\",\\\"name\\\":\\\"معهد علم شرعي\\\",\\\"alternateName\\\":\\\"Share3a Institute of Islamic Sciences\\\",\\\"url\\\":\\\"https://shar3.chiefcoder.net\\\",\\\"description\\\":\\\"معهد علم شرعي — مؤسسة تعليمية إسلامية متخصصة في تعليم العلوم الشرعية: القرآن الكريم، التفسير، الفقه، الحديث، والعقيدة على منهج أهل السنة والجماعة. نقدم برامج علمية متدرجة، دورات شرعية، وحلقات علمية للطلاب والباحثين عن العلم الشرعي.\\\",\\\"inLanguage\\\":\\\"ar\\\",\\\"areaServed\\\":\\\"SA\\\",\\\"knowsAbout\\\":[\\\"القرآن الكريم\\\",\\\"التفسير\\\",\\\"الفقه الإسلامي\\\",\\\"علوم الحديث\\\",\\\"العقيدة الإسلامية\\\",\\\"أهل السنة والجماعة\\\"]}\"}}]]}],[\"$\",\"body\",null,{\"className\":\"flex min-h-full flex-col bg-background text-foreground antialiased\",\"children\":[[\"$\",\"$L12\",null,{}],[\"$\",\"$L13\",null,{\"initialSettings\":{\"site_name_ar\":\"معهد إعداد دعاة التوحيد والسنة\",\"site_name_en\":\"Institute for Training Preachers of Tawhid and the Sunnah\",\"tagline_ar\":\"إعداد علمي .. تأهيل دعوي\",\"tagline_en\":\"A beacon of Islamic knowledge and spiritual refinement\",\"about_ar\":\"صرح علمي ودعوي يُعنى بتأصيل العقيدة الصحيحة، والدعوة إلى الكتاب والسنة بفهم سلف الأمة، وإعداد الدعاة وتأهيلهم علميًا ودعويًا؛ ليكونوا قادرين على تبليغ دين الله بالحكمة والبصيرة.\",\"about_en\":\"An institution dedicated to scholarship and *Da‘wah* (calling to the faith), focused on grounding the correct creed, promoting the Quran and Sunnah according to the understanding of the early generations of the Ummah, and preparing and qualifying preachers—both academically and practically—to convey the religion of Allah with wisdom and insight.\",\"vision_ar\":\"يهدف المعهد إلى تخريج جيل من الدعاة الواعين وطلاب العلم النابهين، وتأصيل الطلاب علميًا وتأهيلهم ليكونوا من العلماء العاملين، القادرين على فهم الكتاب والسنة، والوقوف على كلام أهل العلم، والدعوة إلى الله تعالى بالحكمة والبصيرة.\\nوتقوم الدراسة على التدرج العلمي من التأسيس إلى التأصيل ثم التخصص.\",\"vision_en\":null,\"mission_ar\":\"تقديم تعليم شرعي متدرج ومنهجي يجمع بين الأصالة العلمية والتقنية الحديثة، ويربط الطالب بالقرآن والسنة على فهم السلف الصالح، مع تهيئة بيئة تعليمية محفّزة على حفظ العلم والالتزام والإخلاص.\",\"mission_en\":null,\"study_plan_intro_ar\":\"الخطة في صورتها النهائية\\nالسنة الأولى\\nالسنة التمهيدية: مبادئ العلوم الشرعية واللغوية، وفق الجدول المعتمد المرفق.\\nالسنة الثانية\\nالتأصيل العلمي – الأولى: تأسيس وتوسيع في العلوم الشرعية، مع دراسة سيرة أبي بكر وعمر رضي الله عنهما.\\nالسنة الثالثة\\nالتأصيل العلمي – الثانية: تعمق وتأصيل، مع دراسة سيرة عثمان وعلي رضي الله عنهما والخلافة الراشدة.\\nالسنة الرابعة\\nالتخصص – الأولى: بداية التخصص في إحدى الشعب الأربع.\\nالسنة الخامسة\\nالتخصص – الثانية: التخصص المتقدم، والتطبيق، والبحث، والمناقشة.\\nوبذلك أصبحت الخطة متكاملة في صورتها النهائية، وفق التسلسل:\\nالسنة التمهيدية → التأصيل العلمي → التخصص\\nوتحقق الغاية الأساسية للمعهد: إعداد طالب علم متأصل، وداعية مؤهل، ومتخصص قادر على التعليم والبحث والدعوة وخدمة الكتاب والسنة.\\nتنبيه: الخطة قابلة للتعديل في بعض التفاصيل حسب ما تراه الإدارة أنسب وأنفع للطلاب.\\n\",\"study_plan_intro_en\":null,\"regulations_ar\":\"$14\",\"regulations_en\":\"\u003cp\u003e\u003c/p\u003e\",\"address_ar\":\"مصر\",\"address_en\":null,\"phone\":\"00201007102523\",\"email\":\"duaat.altawheed@gmail.com\",\"whatsapp\":\"00201007102523\",\"facebook\":\"https://www.facebook.com/profile.php?id=61591439512746\",\"twitter\":\"https://x.com/duaataltawheed\",\"instagram\":null,\"youtube\":\"https://www.youtube.com/@duaataltawheed\",\"logo\":\"https://share3a.chiefcoder.net/media/settings/01KYQ4V32TKP4WJHWGX38DMJXA.jpg\",\"favicon\":\"https://share3a.chiefcoder.net/media/settings/01KYQ4V32V5K8995EH67TFDV3E.jpg\",\"footer_text_ar\":\"© معهد علم شرعي — جميع الحقوق محفوظة\",\"footer_text_en\":null,\"dashboard_institute_name_ar\":\"معهد إعداد دعاة التوحيد والسنة\",\"dashboard_institute_name_en\":null,\"academic_year_ar\":\"العام الدراسي 1448ه \",\"academic_year_en\":null,\"dashboard_welcome_
